name: Build, push and deploy to EC2

# Push to development-aws -> build both images on a GitHub-hosted runner,
# push to Docker Hub (tagged :latest and :<commit sha>), then pull + restart
# on the EC2 instance itself via a self-hosted runner registered there.
#
# The deploy job intentionally does NOT ssh in from GitHub's infrastructure
# — the EC2 security group only allows SSH from a single trusted IP, and
# GitHub-hosted runners don't have a fixed IP to allow. Running the deploy
# job as a self-hosted runner on the instance means it reaches out to
# GitHub over outbound HTTPS instead, so no inbound port needs opening.
on:
  push:
    branches:
      - development-aws

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/spectacle3d-backend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/spectacle3d-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          build-args: |
            VITE_API_BASE_URL=/api
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/spectacle3d-frontend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/spectacle3d-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: self-hosted
    steps:
      - name: Pull and restart containers
        run: |
          cd ~/spectacle3d-deploy
          docker compose pull
          docker compose up -d
          docker image prune -f
